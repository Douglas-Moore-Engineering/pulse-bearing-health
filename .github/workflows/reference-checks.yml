name: Reference checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[test,data,api,deploy]'
      - run: python -m pytest -q
      - run: python scripts/run_reference_demo.py --output outputs/reference-ci
      - run: python scripts/validate_review_package.py
