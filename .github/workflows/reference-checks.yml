name: Reference checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[test,data,api,deploy]'
      - run: python -m pytest -q
      - run: python scripts/run_reference_demo.py --output outputs/reference-ci
      - run: python scripts/validate_review_package.py

      - run: python -m pip install -r requirements-notebooks.txt
      - run: python scripts/execute_notebooks.py
